{{- $s := .Values.store -}}
{{- $home := include "urumi.publicUrl" (list . .Values.hosts.store) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: store-setup
  namespace: {{ include "ns.store" . }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  setup.sh: |
    #!/bin/sh
    # Idempotent store bootstrap with WP-CLI. Safe to re-run on every install/upgrade.
    set -eu
    cd /var/www/html
    log() { echo "[store-setup] $*"; }

    log "waiting for WordPress files and the database"
    i=0
    until [ -f wp-config.php ] && wp db query "SELECT 1" >/dev/null 2>&1; do
      i=$((i+1)); [ "$i" -gt 120 ] && { log "gave up waiting"; exit 1; }
      sleep 5
    done

    if ! wp core is-installed 2>/dev/null; then
      log "installing WordPress"
      wp core install --url="$WP_URL" --title="$STORE_TITLE" --admin_user="$WP_ADMIN_USER" \
        --admin_password="$WP_ADMIN_PASSWORD" --admin_email="$WP_ADMIN_EMAIL" --skip-email
    fi
    # Keep the admin password in sync with the Secret (supports rotation via helm upgrade).
    wp user update "$WP_ADMIN_USER" --user_pass="$WP_ADMIN_PASSWORD" --skip-email >/dev/null

    wp option update timezone_string "$STORE_TIMEZONE" >/dev/null
    wp option update blogname "$STORE_TITLE" >/dev/null
    # The WordPress image ships the standard .htaccess rewrite rules; only the structure is set here.
    wp rewrite structure '/%postname%/' >/dev/null

    if ! wp plugin is-installed woocommerce; then
      log "installing WooCommerce ${WOO_VERSION:-latest}"
      if [ -n "$WOO_VERSION" ]; then wp plugin install woocommerce --version="$WOO_VERSION"; else wp plugin install woocommerce; fi
    fi
    wp plugin is-active woocommerce || wp plugin activate woocommerce

    if [ "$INSTALL_STOREFRONT" = "true" ] && ! wp theme is-active storefront 2>/dev/null; then
      log "installing Storefront theme"
      (wp theme is-installed storefront || wp theme install storefront) && wp theme activate storefront || log "Storefront unavailable; keeping the default theme"
    fi

    log "configuring WooCommerce"
    # New stores start in "coming soon" mode, which hides the shop from visitors.
    wp option update woocommerce_coming_soon no >/dev/null
    wp option update woocommerce_store_pages_only no >/dev/null
    wp option update woocommerce_currency "$STORE_CURRENCY" >/dev/null
    wp option update woocommerce_default_country "$STORE_COUNTRY" >/dev/null
    wp option update woocommerce_calc_taxes no >/dev/null
    wp option update woocommerce_enable_guest_checkout yes >/dev/null
    # Demo store: no shipping step, so checkout needs only billing details.
    wp option update woocommerce_ship_to_countries disabled >/dev/null
    wp option update woocommerce_onboarding_profile '{"skipped":true}' --format=json >/dev/null
    # Test-friendly payment: Cash on delivery.
    wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery","description":"Pay with cash upon delivery.","instructions":"Pay with cash upon delivery.","enable_for_methods":[],"enable_for_virtual":"yes"}' --format=json >/dev/null

    log "registering the MCP server's REST API key"
    wp eval '
      global $wpdb;
      $ck = getenv("WOO_CONSUMER_KEY"); $cs = getenv("WOO_CONSUMER_SECRET");
      $table = $wpdb->prefix . "woocommerce_api_keys";
      $hash = wc_api_hash($ck);
      $id = $wpdb->get_var($wpdb->prepare("SELECT key_id FROM $table WHERE consumer_key = %s", $hash));
      $user = get_user_by("login", getenv("WP_ADMIN_USER"));
      if ($id) {
        $wpdb->update($table, array("consumer_secret" => $cs, "permissions" => "read_write"), array("key_id" => $id));
        echo "REST key present\n";
      } else {
        $wpdb->insert($table, array(
          "user_id" => $user->ID, "description" => "Urumi WooCommerce MCP server", "permissions" => "read_write",
          "consumer_key" => $hash, "consumer_secret" => $cs, "truncated_key" => substr($ck, -7),
        ));
        echo "REST key created\n";
      }'

    if [ "$SEED_PRODUCTS" = "true" ]; then
      log "seeding products"
      seed() {
        if [ "$(wp wc product list --sku="$1" --status=any --user="$WP_ADMIN_USER" --format=count)" = "0" ]; then
          wp wc product create --user="$WP_ADMIN_USER" --sku="$1" --name="$2" --regular_price="$3" \
            --short_description="$4" --status=publish --porcelain >/dev/null && log "  + $2"
        fi
      }
      seed URU-TEE-001 "Classic Cotton T-Shirt" 499 "Heavyweight organic cotton tee."
      seed URU-HOD-002 "Everyday Hoodie" 1499 "Brushed fleece, relaxed fit."
      seed URU-MUG-003 "Ceramic Coffee Mug" 349 "350 ml stoneware mug."
      seed URU-CAP-004 "Canvas Baseball Cap" 599 "Adjustable six-panel cap."
      seed URU-BAG-005 "Recycled Tote Bag" 299 "Made from recycled PET."
      seed URU-BTL-006 "Steel Water Bottle" 899 "Double-walled, 750 ml."
    fi

    wp cache flush >/dev/null 2>&1 || true
    log "done: storefront at $WP_URL"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: store-setup
  namespace: {{ include "ns.store" . }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  # Provisioning timeout: a stuck setup fails visibly instead of hanging forever.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "urumi.labels" . | nindent 8 }}
        app.kubernetes.io/name: store-setup
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      # Shares WordPress's ReadWriteOnce volume, so it must land on the same node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: wordpress
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 33 # www-data in the WordPress image, owner of the content volume
        runAsGroup: 33
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wp-cli
          image: {{ include "urumi.image" $s.setup.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/setup.sh"]
          env:
            - name: HOME
              value: /tmp
            # wp-config.php reads these at runtime, so WP-CLI needs the same values as Apache.
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: store-db, key: MARIADB_PASSWORD } }
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', '{{ $home }}');
                define('WP_SITEURL', '{{ $home }}');
            - name: WP_URL
              value: {{ $home | quote }}
            - name: STORE_TITLE
              value: {{ $s.title | quote }}
            - name: STORE_TIMEZONE
              value: {{ $s.timezone | quote }}
            - name: STORE_CURRENCY
              value: {{ $s.currency | quote }}
            - name: STORE_COUNTRY
              value: {{ $s.country | quote }}
            - name: WP_ADMIN_USER
              value: {{ $s.adminUser | quote }}
            - name: WP_ADMIN_EMAIL
              value: {{ $s.adminEmail | quote }}
            - name: WP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: store-admin, key: WP_ADMIN_PASSWORD } }
            - name: WOO_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: store-woo-rest, key: consumer_key } }
            - name: WOO_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: store-woo-rest, key: consumer_secret } }
            - name: WOO_VERSION
              value: {{ $s.setup.woocommerceVersion | quote }}
            - name: INSTALL_STOREFRONT
              value: {{ $s.setup.installStorefrontTheme | quote }}
            - name: SEED_PRODUCTS
              value: {{ $s.setup.seedProducts | quote }}
          resources: {{- toYaml $s.setup.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: content
              mountPath: /var/www/html
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: wordpress-data
        - name: scripts
          configMap:
            name: store-setup
