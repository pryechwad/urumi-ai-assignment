{{- $s := .Values.store -}}
{{- $home := include "urumi.publicUrl" (list . .Values.hosts.store) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: store-setup
  namespace: {{ include "ns.store" . }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  # Single source of truth, shared with the store provisioner (see platform-provisioner.yaml).
  setup.sh: {{ .Files.Get "files/store-setup.sh" | quote }}
  storefront.php: {{ .Files.Get "files/storefront.php" | quote }}
  storefront.css: {{ .Files.Get "files/storefront.css" | quote }}
  catalog.json: {{ .Files.Get "files/catalog.json" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: store-setup
  namespace: {{ include "ns.store" . }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  # Provisioning timeout: a stuck setup fails visibly instead of hanging forever.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "urumi.labels" . | nindent 8 }}
        app.kubernetes.io/name: store-setup
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      # Shares WordPress's ReadWriteOnce volume, so it must land on the same node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: wordpress
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 33 # www-data in the WordPress image, owner of the content volume
        runAsGroup: 33
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wp-cli
          image: {{ include "urumi.image" $s.setup.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/setup.sh"]
          env:
            - name: HOME
              value: /tmp
            # wp-config.php reads these at runtime, so WP-CLI needs the same values as Apache.
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: store-db, key: MARIADB_PASSWORD } }
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', '{{ $home }}');
                define('WP_SITEURL', '{{ $home }}');
            - name: WP_URL
              value: {{ $home | quote }}
            - name: STORE_TITLE
              value: {{ $s.title | quote }}
            - name: STORE_TIMEZONE
              value: {{ $s.timezone | quote }}
            - name: STORE_CURRENCY
              value: {{ $s.currency | quote }}
            - name: STORE_COUNTRY
              value: {{ $s.country | quote }}
            - name: WP_ADMIN_USER
              value: {{ $s.adminUser | quote }}
            - name: WP_ADMIN_EMAIL
              value: {{ $s.adminEmail | quote }}
            - name: WP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: store-admin, key: WP_ADMIN_PASSWORD } }
            - name: WOO_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: store-woo-rest, key: consumer_key } }
            - name: WOO_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: store-woo-rest, key: consumer_secret } }
            - name: WOO_VERSION
              value: {{ $s.setup.woocommerceVersion | quote }}
            - name: INSTALL_STOREFRONT
              value: {{ $s.setup.installStorefrontTheme | quote }}
            - name: SEED_PRODUCTS
              value: {{ $s.setup.seedProducts | quote }}
          resources: {{- toYaml $s.setup.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: content
              mountPath: /var/www/html
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: wordpress-data
        - name: scripts
          configMap:
            name: store-setup
