{{- /*
All credentials live in Kubernetes Secrets, scoped to the namespace that needs them.
Each value comes from values (if given), else the existing Secret (upgrades keep it), else is generated.
*/ -}}
{{- $store := include "ns.store" . -}}
{{- $mcp := include "ns.mcp" . -}}
{{- $platform := include "ns.platform" . -}}
---
# MariaDB credentials: used by MariaDB, WordPress and the store setup Job only.
apiVersion: v1
kind: Secret
metadata:
  name: store-db
  namespace: {{ $store }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: {{ include "urumi.secret" (dict "root" . "id" "dbRoot" "ns" $store "secret" "store-db" "key" "MARIADB_ROOT_PASSWORD" "provided" "" "gen" "") | quote }}
  MARIADB_PASSWORD: {{ include "urumi.secret" (dict "root" . "id" "dbUser" "ns" $store "secret" "store-db" "key" "MARIADB_PASSWORD" "provided" "" "gen" "") | quote }}
---
# WordPress administrator (wp-admin) login.
apiVersion: v1
kind: Secret
metadata:
  name: store-admin
  namespace: {{ $store }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  WP_ADMIN_PASSWORD: {{ include "urumi.secret" (dict "root" . "id" "wpAdmin" "ns" $store "secret" "store-admin" "key" "WP_ADMIN_PASSWORD" "provided" .Values.secrets.storeAdminPassword "gen" "") | quote }}
---
# WooCommerce REST API key. The setup Job registers it in WooCommerce (only its hash is stored there).
apiVersion: v1
kind: Secret
metadata:
  name: store-woo-rest
  namespace: {{ $store }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  consumer_key: {{ include "secret.wooKey" . | quote }}
  consumer_secret: {{ include "secret.wooSecret" . | quote }}
---
# The same REST key, for the WooCommerce MCP server in its own namespace, plus the token the
# gateway must present to call it.
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp
  namespace: {{ $mcp }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  WOO_CONSUMER_KEY: {{ include "secret.wooKey" . | quote }}
  WOO_CONSUMER_SECRET: {{ include "secret.wooSecret" . | quote }}
  MCP_AUTH_TOKEN: {{ include "secret.wooMcpToken" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-mcp
  namespace: {{ $mcp }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_AUTH_TOKEN: {{ include "secret.inventoryMcpToken" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: support-mcp
  namespace: {{ $mcp }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_AUTH_TOKEN: {{ include "secret.supportMcpToken" . | quote }}
---
# Gateway: database, credential-encryption key, bootstrap admin, LLM key, and the upstream
# tokens it seeds (encrypted into Postgres) on first start.
{{- $pgPassword := include "urumi.secret" (dict "root" . "id" "pg" "ns" $platform "secret" "gateway" "key" "POSTGRES_PASSWORD" "provided" "" "gen" "") }}
apiVersion: v1
kind: Secret
metadata:
  name: gateway
  namespace: {{ $platform }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  DATABASE_URL: {{ printf "postgres://gateway:%s@postgres.%s.svc.cluster.local:5432/gateway" $pgPassword $platform | quote }}
  CREDENTIALS_KEY: {{ include "urumi.secret" (dict "root" . "id" "credKey" "ns" $platform "secret" "gateway" "key" "CREDENTIALS_KEY" "provided" "" "gen" "base64key") | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ include "urumi.secret" (dict "root" . "id" "adminPw" "ns" $platform "secret" "gateway" "key" "BOOTSTRAP_ADMIN_PASSWORD" "provided" .Values.secrets.bootstrapAdminPassword "gen" "") | quote }}
  SEED_WOO_TOKEN: {{ include "secret.wooMcpToken" . | quote }}
  SEED_INVENTORY_TOKEN: {{ include "secret.inventoryMcpToken" . | quote }}
  SEED_SUPPORT_TOKEN: {{ include "secret.supportMcpToken" . | quote }}
  {{- if and .Values.secrets.llmApiKey (not .Values.secrets.llmExistingSecret) }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  {{- else if not .Values.secrets.llmExistingSecret }}
  {{- $existing := lookup "v1" "Secret" $platform "gateway" }}
  {{- if and $existing (hasKey (default (dict) $existing.data) "LLM_API_KEY") }}
  # Kept from the previous release (set out of band, e.g. kubectl patch).
  LLM_API_KEY: {{ index $existing.data "LLM_API_KEY" | b64dec | quote }}
  {{- end }}
  {{- end }}
